name: Release new version

on:
  workflow_dispatch:

permissions:
  contents: read

# Prevent parallel releases from computing the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Bumps version, tags and pushes. If a later job fails, re-run only the failed jobs.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ fromJson(steps.define-release-version.outputs.result) }}

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Deploy key can push to protected main, GITHUB_TOKEN cannot
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Set up npm
        uses: ./.github/actions/setup-npm
        with:
          yospace-auth-token: ${{ secrets.NPM_YOSPACE_AUTH_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Read latest release version from package.json
        uses: actions/github-script@v8
        id: read-latest-release-version
        with:
          script: |
            const { version } = require('./package.json')
            core.info(`Latest release version is ${version}`)
            core.setOutput('latestReleaseVersion', version)

      - name: Define next release version based on Changelog entries
        uses: actions/github-script@v8
        id: define-release-version
        with:
          script: |
            const { defineReleaseVersion } = require('./.github/scripts/defineVersion.js')
            return defineReleaseVersion({core}, "${{ steps.read-latest-release-version.outputs.latestReleaseVersion }}", './CHANGELOG.md' )

      - name: Bump package.json and Changelog version
        run: |
          npm --no-git-tag-version version "${{ fromJson(steps.define-release-version.outputs.result) }}"
          npx kacl release

      # Catch packaging errors before anything is pushed
      - name: Verify package contents
        run: npm pack --dry-run

      - name: Add tag and push changes
        run: |
          git config --global user.name 'Automated Release'
          git config --global user.email 'release-automation@bitmovin.com'
          git add .
          git commit -m "Bump version and update changelog"
          git tag -a "${{ fromJson(steps.define-release-version.outputs.result) }}" -m "v${{ fromJson(steps.define-release-version.outputs.result) }}"
          git push --atomic origin main "${{ fromJson(steps.define-release-version.outputs.result) }}"

  # Publishes the tagged version. Safe to re-run: it only reads the tag pushed by the release job.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up npm
        uses: ./.github/actions/setup-npm
        with:
          yospace-auth-token: ${{ secrets.NPM_YOSPACE_AUTH_TOKEN }}

      # prepublishOnly runs lint and build
      - name: Publish to npm
        run: npm publish

  # Separate job, so a re-run does not publish the same npm version again
  github-release:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ needs.release.outputs.version }}
